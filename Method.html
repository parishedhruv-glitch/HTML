<!DOCTYPE html>
<html>
    <body>
        <h2> Javascript string methods </h2>
        <p>basic methods</p>
        <script>
            var str2 = "AmAzInG";
            document.write(str2.toUpperCase());
            document.write("<br>");
            document.write(str2.toLowerCase());
            document.write("<br>");
            document.write(str2.startsWith("i"));
            document.write("<br>");

            var str1 = "i learnt about methods";
            var patt = new RegExp("about");
            var res = patt.test(str1);
            document.write(res);



        </script>
    </body>
</html>
