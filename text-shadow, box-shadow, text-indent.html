<!DOCTYPE html>
<html>

<head>
 
  <title> text-shadow, box-shadow, <text-indent></text-indent> </title>
  <style>
    *{
        text-align: center;
        font-family: monospace;
    }
    #text{
        text-shadow: 2px 2px 1px green;
    }
    #box{
        box-shadow: 9px 9px 5px blue;
    }
    #indent{
        text-indent: 50%; 
    }
  </style>
</head>
<body>
    <h1 id="text"> we can use text shadow to give shadow to the text itself</h1>
    <h1 id="box"> or use box shadow to give shadow tot he element </h1>
    <p> this is an example of text indent </p>
    <p id="indent"> this is an example of text indent </p>
        
    </h1>
</body>
 <html></html>
