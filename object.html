<!DOCTYPE html>
<html>
    <body>"
        <P> finding the largest number with the help of Arguement Objects</P>
        <p id="result"></p>
        <script>
            function findMax() {
                var i;
                var max = 0;
                for(i = 0; i < arguments.length; i++) {
                    if (arguments[i] > max) {
                        max = arguments[i];
                    }
                }
                return max;
            }
            document.getElementById("result").innerHTML = findMax(42, 2, 6);
        </script>
    </body>
</html>
