<!DOCTYPE html>
<html>

<head>
 
  <title> text styling<text-indent></text-indent> </title>
  <style>
    h1 {
        text-decoration: overline;
        text-transform: uppercase;


    }
    h2{
        text-decoration: line-through;
        text-transform : capitalize;
    }
    h3{
        text-decoration: underline;
        text-transform : lowercase;
    }
    h4{
        text-decoration: underline overline;
        text-transform : none;
    }
    h5{
        text-shadow: 2px 2px 3px yellow;
    }
    #box {
        box-shadow: 5px 6px 7px green;

    }
    #indent {
        text-indent: 50%;

    }
  </style>
</head>
<body>
    <h1> Codingal</h1>
    <h2> Codingal</h2>
    <h3> Codingal</h3>
    <h4> Codingal</h4>
    <h5> Codingal</h5>
    <p id="box"> Codingal</p>
    <p id="indent"> Codingal</p>
</body>
</html>
