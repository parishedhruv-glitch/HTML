<!DOCTYPE html>
<html>

<body>

<h2> Operator</h2>
<p id="demo"></p>
<p id="deno"></p>
<p id="dedo"></p>
<p id="dero"></p>
<script>
<!--Addition-->
//*use +, -, *, / operators*/
var x = 5;
var y = 2;
var z = x + y;
document.getElementById("demo").innerHTML = z;

var x = 19;
var y = 9;
var z = x - y;
document.getElementById("deno").innerHTML = z;

var x = 48;
var y = 8;
var z = x / y;
document.getElementById("dedo").innerHTML = z;

var x = 7;
var y = 4;
var z = x * y;
document.getElementById("dero").innerHTML = z;

</script>

</body>

</html>
