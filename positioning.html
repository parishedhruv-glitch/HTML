<!DOCTYPE html>
<html>
    <HEAD>
        <style>
            div.static{
                right:30px;
                border:3px solid green;
            }
            div.absolute {
                position: absolute;
                left: 50px;
                border: 3px solid orange;

            }
            div.relative {
                position:relative;
                left: 50px;
                border:3px solid  YELLOW;
            }
            div.fixed {
                position:fixed;
                top:0;
                right:20px;
                width:300px;
                border:3px solid RED;
            }
            DIV.sticky{
                position : sticky;
                top: 1px;
                left: 20px;
                width:100px;
                border: 3px solid BLUE;
            }
        </style>
    </HEAD>
<body> 
    <h2> positioning</h2>
    <div class="static"> 
        div with not position property
    </div>
    
    <div class="sticky">
        div with sticky position property
    </div>
    
    <div class="relative">
        this div element has the position of relative
        <div class="absolute">
        absolute class div
        </div>
    </div>

    <div class="fixed">
        div with the fixed position property

    </div>
